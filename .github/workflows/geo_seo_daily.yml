name: النشر اليومي المتوافق مع SEO و GEO (بحث مصر والذكاء الاصطناعي)

on:
  schedule:
    - cron: "35 12 * * *"   # يومياً الساعة 2:35 ظهراً بتوقيت القاهرة (مقال واحد لرفيو + مقال واحد لايجبتاوى)
  workflow_dispatch:
    inputs:
      site:
        description: "الموقع (all, egyptaway, review)"
        required: false
        default: "all"
      dry_run:
        description: "تجربة بدون نشر (1 = تجربة، 0 = نشر)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: geo-seo-daily
  cancel-in-progress: false

jobs:
  run-geo-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow arabic-reshaper python-bidi
      - name: Run Daily SEO & GEO Publisher
        env:
          SITE: ${{ github.event.inputs.site || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python -u geo_seo_daily.py --site "$SITE"
      - name: Commit state & branded images
        if: always()
        run: |
          git config user.name "geo-seo-bot"
          git config user.email "geo-seo-bot@users.noreply.github.com"
          git add geo_seo_posted.json img/ img_hashes_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(geo-seo): daily high-intent SEO/GEO post $(TZ=Africa/Cairo date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
