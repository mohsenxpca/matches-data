name: أخبار الكورة على ايجبتاوى

on:
  schedule:
    - cron: "5 7 * * *"     # كل يوم الصبح (~9-10 بتوقيت القاهرة)، والنشر نفسه بيتجدول في مواعيد عشوائية من 11 لـ 11 بالليل
  workflow_dispatch:
    inputs:
      count:
        description: "عدد الأخبار"
        default: "2"
      day_cap:
        description: "أقصى عدد مقالات في اليوم على ايجبتاوى"
        default: "10"

permissions:
  contents: write

concurrency:
  group: football-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python news.py || true
      - run: python -u football.py
        env:
          COUNT: ${{ github.event.inputs.count || '2' }}
          DAY_CAP: ${{ github.event.inputs.day_cap || '10' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add football_posted.json news.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "football posts $(TZ=Africa/Cairo date +%F_%H:%M)"
          git pull --rebase origin main
          git push origin main
