name: نتائج المباريات الكبيرة على ايجبتاوى

on:
  schedule:
    - cron: "*/20 * * * *"   # كل 20 دقيقة: لو ماتش كبير خلص (بعد ساعتين و20 دقيقة من البداية) يتنشر مقال النتيجة
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة من غير نشر (1 = تجربة)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: results-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow arabic-reshaper python-bidi
      - run: python -u results.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          DAY_CAP: "50"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add results_posted.json img 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "results $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
