name: مراجعات وأخبار الهواتف لموقع رفيو (نشر فوري معايير أدسنس)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "عدد مقالات الهواتف المطلوب نشرها على موقع رفيو"
        required: false
        default: "1"
      phone_model:
        description: "اسم الهاتف أو موضوع الخبر اختيارياً (اتركه فارغاً للرصد التلقائي لأحدث الهواتف والأخبار)"
        required: false
        default: ""
      mode:
        description: "نوع المحتوى: all (مراجعات وأخبار تلقائياً) أو news (أخبار وتسريبات فقط) أو review (مراجعات هواتف فقط)"
        required: false
        default: "all"
      dry_run:
        description: "تجربة بدون نشر (1 = تجربة، 0 = نشر مباشر)"
        required: false
        default: "0"
  schedule:
    - cron: "15 */2 * * *"  # كل ساعتين على مدار الـ 24 ساعة (فواصل طبيعية لحماية أدسنس وضمان استقرار النشر)
  push:
    branches:
      - main
    paths:
      - ".github/workflows/review.yml"

permissions:
  contents: write

concurrency:
  group: review-engine
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow arabic-reshaper python-bidi
      - run: python -u review_engine.py
        env:
          COUNT: ${{ github.event.inputs.count || '2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PHONE_MODEL: ${{ github.event.inputs.phone_model || '' }}
          MODE: ${{ github.event.inputs.mode || 'all' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add review_posted.json img 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "review post and clean phone images $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
