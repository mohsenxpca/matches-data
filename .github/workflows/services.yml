name: صفحات الخدمات (الصلاة والعملات والذهب والطقس + الخليج + المواسم)

on:
  schedule:
    - cron: "5 */3 * * *"    # كل 3 ساعات
    - cron: "7 21 * * *"    # بعد نص الليل بتوقيت القاهرة (مواقيت اليوم الجديد)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: services
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow
      - run: python -u services.py
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - run: python -u gulf.py
        if: always()
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - run: python -u seasonal.py
        if: always() && (github.event.schedule == '7 21 * * *' || github.event_name == 'workflow_dispatch')
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit history
        if: always()
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add services_history.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "services $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
