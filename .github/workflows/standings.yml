name: جدول ترتيب الدوري المصري

on:
  schedule:
    - cron: "25 */3 * * *"   # كل 3 ساعات
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - run: python -u standings.py
        env:
          TABLE_PAGE_ID: "5530812053398877782"
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit standings.json
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add standings.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "update table $(TZ=Africa/Cairo date +%F_%H:%M)"
          git pull --rebase origin main
          git push origin main
