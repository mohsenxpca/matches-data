name: صيانة ايجبتاوى اليومية وتصحيح الروابط

on:
  schedule:
    - cron: "0 4 * * *"   # كل 24 ساعة الساعة 6:00 صباحاً بتوقيت القاهرة
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u maintenance.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
