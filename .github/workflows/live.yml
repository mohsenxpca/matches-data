name: نتائج مباشرة

# كل 5 دقائق في أوقات المباريات (من حوالي 11 الصبح لـ 3 الفجر بتوقيت القاهرة)
# بيقرا امبارح والنهارده بس، فبياخد ثواني
on:
  schedule:
    - cron: "*/5 9-23 * * *"
    - cron: "*/5 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-matches
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: pip install -r .github/requirements.txt
      - run: python scrape.py 1 0
      - run: python -u team_push.py   # إشعار قبل ماتش الفريق المفضل وبعده (للي معلّمين الفريق بس)
        continue-on-error: true
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      - name: Commit data.json
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add data.json
          [ -f team_push_state.json ] && git add team_push_state.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "live $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
