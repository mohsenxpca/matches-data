name: نتائج مباشرة

# كل 5 دقائق في أوقات المباريات (من حوالي 11 الصبح لـ 3 الفجر بتوقيت القاهرة)
# بيقرا امبارح والنهارده بس، فبياخد ثواني
on:
  schedule:
    - cron: "*/5 9-23 * * *"
    - cron: "*/5 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt
      - run: pip install -r .github/requirements.txt
      - run: python scrape.py 1 0
      - name: Commit data.json
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "live $(TZ=Africa/Cairo date +%F_%H:%M)"
          git pull --rebase origin main
          git push origin main
