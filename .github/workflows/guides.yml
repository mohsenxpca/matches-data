name: أدلة ايجبتاوى الإرشادية (Evergreen Guides)

on:
  schedule:
    - cron: "*/30 * * * *"   # كل نصف ساعة على مدار الـ 24 ساعة
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة من غير نشر (1 = تجربة بدون نشر، 0 = نشر فوري)"
        required: false
        default: "0"
      topic_id:
        description: "تحديد موضوع معين اختياري"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: guides-publishing
  cancel-in-progress: false

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Generate and Publish Evergreen Guide (Every 30 Mins)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          if [ -n "${{ github.event.inputs.topic_id }}" ]; then
            python -u guides.py --topic-id "${{ github.event.inputs.topic_id }}"
          else
            python -u guides.py
          fi

      - name: Upload preview artifact on dry run
        if: github.event.inputs.dry_run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: guide-dry-run-preview
          path: out/*.html
          if-no-files-found: ignore

      - name: Save state (non-blocking rebase push)
        if: github.event.inputs.dry_run != '1'
        run: |
          git config user.name "guides-bot"
          git config user.email "guides-bot@users.noreply.github.com"
          git add guides_posted.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "guide post $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
