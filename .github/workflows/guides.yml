name: مقال منوعات اليومي لايجبتاوى (Daily Misc & Guides)

on:
  schedule:
    - cron: "15 11 * * *"   # مرة واحدة يومياً الساعة 1:15 ظهراً بتوقيت القاهرة
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة من غير نشر (1 = تجربة بدون نشر، 0 = نشر فوري)"
        required: false
        default: "0"
      topic_id:
        description: "تحديد موضوع معين اختياري"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: misc-publishing
  cancel-in-progress: false

jobs:
  run-misc-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4 lxml pillow arabic-reshaper python-bidi

      - name: تشغيل محرك مقال منوعات اليومي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.topic_id }}" != "" ]; then
            python -u guides.py --topic-id "${{ github.event.inputs.topic_id }}"
          else
            python -u guides.py
          fi

      - name: حفظ وتحديث سجل النشر
        run: |
          git config user.name "egyptaway"
          git config user.email "122121051+mohsenxpca@users.noreply.github.com"
          git add guides_posted.json img/ img_hashes_cache.json
          git commit -m "chore(misc): record daily misc guide publication" || true
          git pull --rebase origin main || true
          git push origin main || true
