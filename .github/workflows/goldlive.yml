name: أسعار الذهب والدولار اللحظية

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقايق (والصفحة بتحرّك السعر كل دقيقة مع الأونصة)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: goldlive
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python -u goldlive.py
      - name: Push live.json to the live branch (history not kept)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp live.json out/ && cd out
          git init -q && git checkout -q -b live
          git add live.json
          git -c user.name=matches-bot -c user.email=matches-bot@users.noreply.github.com commit -qm "live $(date -u +%H:%M)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
