name: أسعار الذهب والدولار اللحظية

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقايق (والصفحة بتحرّك السعر كل دقيقة مع الأونصة)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: goldlive
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - name: Fetch previous live.json
        run: |
          git fetch origin live 2>/dev/null && git checkout origin/live -- live.json 2>/dev/null || true
      - run: python -u goldlive.py
      - name: Push live.json to the live branch (history not kept)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f live.json ]; then
            echo "live.json not available, skipping push peacefully."
            exit 0
          fi
          mkdir -p out && cp live.json out/ && cd out
          git init -q && git checkout -q -b live
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add live.json
          git commit -qm "live $(date -u +%H:%M)"
          for i in 1 2 3 4 5; do
            git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live && exit 0 || sleep 3
          done
          echo "Warning: git push to live branch failed after 5 retries; skipping peacefully to avoid failing workflow."
          exit 0
