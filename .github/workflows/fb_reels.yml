name: نشر 2 ريلز يومياً على صفحة موبايل بالعربى (أوقات الذروة)

on:
  schedule:
    - cron: "30 12 * * *"   # 2:30 PM بتوقيت القاهرة (ذروة بعد الظهر)
    - cron: "0 19 * * *"    # 9:00 PM بتوقيت القاهرة (ذروة المساء الكبرى للريلز)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون نشر (1 = تجربة)"
        default: "0"
      force:
        description: "نشر ريلز فوري الآن (1 = أيوه)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: fb-reels
  cancel-in-progress: false

jobs:
  publish_reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow numpy arabic-reshaper python-bidi
      - run: python -u fb_reels.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add notify_sent.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fb reel published $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
