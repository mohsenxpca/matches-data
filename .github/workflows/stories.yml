name: توليد ونشر استوريهات جوجل (Google Web Stories)

on:
  schedule:
    - cron: "35 * * * *"   # كل ساعة عند الدقيقة 35
  workflow_dispatch:
    inputs:
      count:
        description: "عدد الاستوريهات المطلوب توليدها"
        default: "15"

permissions:
  contents: write

concurrency:
  group: web-stories-deploy
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python stories_engine.py --count ${{ github.event.inputs.count || '15' }} --out out_stories
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out_stories
          branch: gh-pages
          clean: true
          commit-message: "deploy: automated Google Web Stories on news.egyptaway.com [skip ci]"
