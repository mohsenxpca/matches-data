name: الربط الداخلي التلقائي (Contextual Interlinking)

on:
  schedule:
    - cron: "*/15 * * * *"   # كل ربع ساعة على مدار الـ 24 ساعة
  workflow_dispatch:
    inputs:
      site:
        description: "الموقع (egyptaway, review, all)"
        required: false
        default: "all"
      days:
        description: "عدد الأيام السابقة لفحص المقالات (الافتراضي 2)"
        required: false
        default: "2"
      all_missing:
        description: "فحص وتحديث كل مقالات الموقع التي ينقصها روابط داخلية (true/false)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: interlink-run
  cancel-in-progress: false

jobs:
  interlink:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Run Contextual Interlinker
        run: |
          if [ "${{ github.event.inputs.all_missing }}" = "true" ]; then
            python -u interlink_engine.py --site "${{ github.event.inputs.site || 'all' }}" --all-missing --confirm
          else
            DAYS="${{ github.event.inputs.days || '2' }}"
            SITE="${{ github.event.inputs.site || 'all' }}"
            python -u interlink_engine.py --site "$SITE" --days "$DAYS" --confirm
          fi
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit Interlink State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add interlink_posted.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "update: contextual interlinking log $(date +'%Y-%m-%d_%H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
