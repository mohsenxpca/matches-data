name: أخبار الألعاب والعروض على ايجبتاوى

# بيتشغّل كل يوم 09:40 UTC من Cloudflare (egyptaway-scheduler) مش من cron جيت هب، علشان جيت هب كان بيأخره ساعات ويكرره
on:
  workflow_dispatch:
    inputs:
      count:
        description: "عدد أخبار الألعاب"
        default: "3"
      day_cap:
        description: "أقصى عدد مقالات في اليوم على ايجبتاوى"
        default: "30"

permissions:
  contents: write

concurrency:
  group: football-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml pillow arabic-reshaper python-bidi
      - run: python -u tech.py
        env:
          PROFILE: games
          COUNT: ${{ github.event.inputs.count || '3' }}
          DAY_CAP: ${{ github.event.inputs.day_cap || '50' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - run: python -u tech.py
        if: always()
        env:
          PROFILE: deals
          COUNT: "1"
          DAY_CAP: ${{ github.event.inputs.day_cap || '50' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "matches-bot"
          git config user.email "matches-bot@users.noreply.github.com"
          git add games_posted.json deals_posted.json img 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "games posts $(TZ=Africa/Cairo date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
