name: محرك الباك لينكات التلقائي (Autonomous Backlinks & Authority Engine)

on:
  schedule:
    # يعمل أوتوماتيكياً كل أحد وأربعاء الساعة 07:00 صباحاً بالتوقيت العالمي (09:00 صباحاً بتوقيت القاهرة)
    - cron: "0 7 * * 0,3"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backlinks_auto.yml"
      - "backlinks_engine.py"

permissions:
  contents: write

concurrency:
  group: backlinks-engine
  cancel-in-progress: false

jobs:
  backlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests huggingface_hub
      - name: Run Autonomous Backlinks Engine
        run: python -u backlinks_engine.py
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
      - name: Commit Backlinks State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backlinks_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "chore(seo): update autonomous backlinks state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break || sleep 3
          done
